<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhantomRecon — Pentest Framework</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{text-shadow:0 0 10px rgba(0,255,136,.5)}50%{text-shadow:0 0 25px rgba(0,255,136,.8)}}
body{background:#000;color:#00ff88;font-family:'Consolas','Courier New',monospace;overflow:hidden;height:100vh}
#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:.15}
.container{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px;height:100vh;display:flex;flex-direction:column}
.header{text-align:center;padding:15px 0;border-bottom:1px solid #00ff88;margin-bottom:12px;flex-shrink:0}
.header h1{color:#00ff88;font-size:22px;letter-spacing:6px;animation:pulse 2s infinite}
.header .sub{color:#444;font-size:11px;margin-top:3px;letter-spacing:2px}
.top-bar{display:flex;gap:8px;margin-bottom:10px;flex-shrink:0;flex-wrap:wrap}
.top-bar input{flex:1;min-width:180px;padding:10px 14px;background:#0a0a0a;border:1px solid #1a3a2a;color:#00ff88;font-family:inherit;font-size:13px;outline:none;border-radius:3px}
.top-bar input:focus{border-color:#00ff88}
.top-bar select{padding:10px;background:#0a0a0a;border:1px solid #1a3a2a;color:#00ff88;font-family:inherit;font-size:13px;outline:none;border-radius:3px;cursor:pointer}
.top-bar button{padding:10px 24px;background:#00ff88;color:#000;border:none;font-family:inherit;font-size:13px;font-weight:bold;border-radius:3px;cursor:pointer;transition:.2s}
.top-bar button:hover{background:#00cc6a;box-shadow:0 0 15px rgba(0,255,136,.3)}
.top-bar button:disabled{opacity:.4;cursor:not-allowed}
.terminal{flex:1;background:rgba(0,5,0,.85);border:1px solid #1a3a2a;border-radius:4px;padding:12px 14px;overflow-y:auto;font-size:12px;line-height:1.6;min-height:0;font-family:'Consolas','Courier New',monospace}
.terminal::-webkit-scrollbar{width:4px}
.terminal::-webkit-scrollbar-thumb{background:#1a3a2a;border-radius:2px}
.term-line{margin:0;white-space:pre-wrap;word-break:break-all}
.term-line.info{color:#888}
.term-line.ok{color:#00ff88}
.term-line.warn{color:#ffaa00}
.term-line.error{color:#ff4444}
.term-line.critical{color:#ff4444;font-weight:bold}
.term-line.module{color:#00ff88;font-weight:bold;text-shadow:0 0 10px rgba(0,255,136,.3)}
.term-line.separator{color:#1a3a2a}
.term-line.done{color:#00ff88;font-weight:bold;animation:pulse 1s infinite}
.term-prompt{color:#00ff88;animation:blink 1s infinite}
.results{flex-shrink:0;display:none;max-height:40%;overflow-y:auto;background:rgba(0,5,0,.9);border:1px solid #1a3a2a;border-radius:4px;margin-top:8px;padding:10px 14px;font-size:12px}
.results.visible{display:block}
.results a{color:#00ff88}
.footer{text-align:center;padding:8px 0;color:#333;font-size:10px;flex-shrink:0;border-top:1px solid #0a1a0f;margin-top:8px}
.footer a{color:#00ff88;text-decoration:none}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="container">
<div class="header"><h1>PHANTOMRECON <span style="color:#4488ff;font-size:14px;letter-spacing:2px">Free</span></h1><div class="sub">Offensive Security Toolkit v{VERSION} — Windows Native</div></div>
<div class="top-bar">
<input type="text" id="target" placeholder="Dominio ou IP (ex: scanme.nmap.org)" onkeydown="if(event.key==='Enter')startScan()">
<select id="profile">
<option value="aggressive">Agressivo (recon+web+vuln+exploit)</option>
<option value="audit">Auditoria (recon+web+vuln)</option>
<option value="safe">Seguro (recon only)</option>
</select>
<button id="scanBtn" onclick="startScan()">EXECUTAR</button>
</div>
<div class="terminal" id="terminal"><span class="term-prompt">_</span></div>
<div class="results" id="results"></div>
<div class="footer">PhantomRecon Free v{VERSION} — <a href="https://github.com/Raphaellopes-dev/phantomrecon" target="_blank">github.com/Raphaellopes-dev/phantomrecon</a></div>
</div>
<script>
const canvas=document.getElementById('matrix'),ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF';
const fontSize=12,cols=canvas.width/fontSize;
const drops=Array(Math.floor(cols)).fill(1);
function drawMatrix(){ctx.fillStyle='rgba(0,0,0,.05)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#00ff88';ctx.font=fontSize+'px monospace';for(let i=0;i<drops.length;i++){const text=chars[Math.floor(Math.random()*chars.length)];ctx.fillText(text,i*fontSize,drops[i]*fontSize);if(drops[i]*fontSize>canvas.height&&Math.random()>.975)drops[i]=0;drops[i]++}}
setInterval(drawMatrix,50);
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight});
const term=document.getElementById('terminal');
const resultsDiv=document.getElementById('results');
const scanBtn=document.getElementById('scanBtn');
function log(msg,level='info'){const line=document.createElement('div');line.className='term-line '+level;line.textContent=msg;term.appendChild(line);term.scrollTop=term.scrollHeight}
function clearTerm(){term.innerHTML=''}
async function startScan(){
    const target=document.getElementById('target').value.trim();
    if(!target){document.getElementById('target').focus();return}
    const profile=document.getElementById('profile').value;
    scanBtn.disabled=true;scanBtn.textContent='EXECUTANDO...';
    resultsDiv.className='results';resultsDiv.innerHTML='';clearTerm();
    log('==================================================','separator');
    log(' PHANTOMRECON Free v{VERSION}','module');
    log(' Iniciando ataque em: '+target,'ok');
    log(' Perfil: '+profile,'info');
    log('==================================================','separator');
    try{
        const resp=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target,profile})});
        const data=await resp.json();
        if(data.error){log(' ERRO: '+data.error,'error');scanBtn.disabled=false;scanBtn.textContent='EXECUTAR';return}
        const sid=data.scan_id;
        pollResults(sid);
    }catch(e){log(' ERRO DE CONEXAO','error');scanBtn.disabled=false;scanBtn.textContent='EXECUTAR'}
}
async function pollResults(scanId){
    try{
        const resp=await fetch('/api/log?id='+scanId);
        const data=await resp.json();
        const lines=data.log||[];
        const current=term.querySelectorAll('.term-line').length;
        for(let i=0;i<lines.length;i++){const l=lines[i];if(i>=current-1){log(l.msg,l.level)}}
        if(data.done){
            log('==================================================','separator');
            log(' ANALISE CONCLUIDA','done');
            log('==================================================','separator');
            showResults(data.results);
            scanBtn.disabled=false;scanBtn.textContent='EXECUTAR';
            return;
        }
    }catch(e){}
    setTimeout(()=>pollResults(scanId),200);
}
function showResults(r){
    if(!r)return;
    let html='<b style="color:#00ff88">RELATORIOS:</b><br>';
    if(r.html_file)html+='<a href="/report/'+r.html_file+'" target="_blank">[HTML] '+r.html_file.split('/').pop()+'</a><br>';
    if(r.html_file)html+='<a href="/report/'+r.html_file+'?print=1" target="_blank">[PDF] '+r.html_file.split('/').pop().replace('.html','.pdf')+'</a><br>';
    if(r.security_score){
        let s=r.security_score,color=s.score>=70?'#00ff88':s.score>=40?'#ffaa00':'#ff4444';
        html+='<br><b style="color:'+color+'">Security Score: '+s.score+'/100 (Grade: '+s.grade+')</b>';
    }
    if(r.ports)html+='<br><b>Portas abertas:</b> '+r.ports.length;
    if(r.directories)html+='<br><b>Diretorios:</b> '+r.directories.length;
    if(r.admin_panels)html+='<br><b>Paineis admin:</b> '+r.admin_panels.length;
    if(r.vulnerabilities)html+='<br><b>Vulnerabilidades:</b> '+r.vulnerabilities.length;
    if(r.cves)html+='<br><b>CVEs:</b> '+r.cves.length;
    if(r.wordpress&&r.wordpress.wp_users)html+='<br><b>Usuarios WP expostos:</b> '+r.wordpress.wp_users.join(', ');
    if(r.avaliacao)html+='<br><br><b style="color:#00ff88">AVALIACAO FINAL:</b><br><span style="color:#888;font-size:11px">'+r.avaliacao.replace(/\n/g,'<br>')+'</span>';
    if(r.tech&&Object.keys(r.tech).length)html+='<br><b>Tecnologias:</b> '+Object.keys(r.tech).length;
    resultsDiv.innerHTML=html;resultsDiv.className='results visible';
}
</script>
</body>
</html>
